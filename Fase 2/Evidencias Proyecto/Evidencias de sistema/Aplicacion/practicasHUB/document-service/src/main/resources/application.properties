# Render asigna el puerto en la variable PORT; en local se usa 8083
server.port=${PORT:8083}

spring.servlet.multipart.max-file-size=40MB
spring.servlet.multipart.max-request-size=45MB

supabase.url=${SUPABASE_URL}
supabase.key=${SUPABASE_KEY}
supabase.bucket=${SUPABASE_BUCKET:practicahub-files}

spring.datasource.url = jdbc:postgresql://aws-1-us-west-2.pooler.supabase.com:6543/postgres?currentSchema=schema_document&prepareThreshold=0
spring.datasource.username = postgres.pnybwsvwnvoyibtxyrfm
spring.datasource.password = ${SUPABASE_PASSWORD}
spring.datasource.driver-class-name = org.postgresql.Driver

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto = update
spring.jpa.show-sql = true

# URLs de los otros microservicios (en Render, sus direcciones https://...onrender.com)
services.auth.url=${AUTH_SERVICE_URL:http://practicahub-auth:8081}
services.practice.url=${PRACTICE_SERVICE_URL:http://practicahub-practice:8082}
services.notification.url=${NOTIFICATION_SERVICE_URL:http://practicahub-notification:8084}

# clave compartida con el api-gateway y los otros servicios (vacia = no se exige)
internal.secret=${INTERNAL_SECRET:}
