spring.application.name=practice-service
# Render asigna el puerto en la variable PORT; en local se usa 8082
server.port=${PORT:8082}

spring.datasource.url = jdbc:postgresql://aws-1-us-west-2.pooler.supabase.com:6543/postgres?currentSchema=schema_practice&prepareThreshold=0
spring.datasource.username = postgres.pnybwsvwnvoyibtxyrfm
spring.datasource.password = ${SUPABASE_PASSWORD}
spring.datasource.driver-class-name = org.postgresql.Driver

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto = update
spring.jpa.show-sql = true

# URLs de los otros microservicios (en Render, sus direcciones https://...onrender.com)
services.auth.url=${AUTH_SERVICE_URL:http://practicahub-auth:8081}
services.notification.url=${NOTIFICATION_SERVICE_URL:http://practicahub-notification:8084}

# clave compartida con el api-gateway y los otros servicios (vacia = no se exige)
internal.secret=${INTERNAL_SECRET:}

# clave para cifrar los mensajes entre docente y estudiante (vacia = clave de desarrollo)
messages.key=${MESSAGE_KEY:}
