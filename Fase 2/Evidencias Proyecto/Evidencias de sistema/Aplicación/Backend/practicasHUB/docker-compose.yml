services:
  # bd auth-service
  auth-db:
    image: postgres:15
    container_name: auth-db-ph
    environment:
      POSTGRES_DB: auth_db
      POSTGRES_USER: ${AUTH_DB_USER}
      POSTGRES_PASSWORD: ${AUTH_DB_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - auth_postgres_data:/var/lib/postgresql/data

  # bd nucleo practice
  practice-db:
    image: postgres:15
    container_name: practice-db-ph
    environment:
      POSTGRES_USER: ${PRACTICE_DB_USER}
      POSTGRES_PASSWORD: ${PRACTICE_DB_PASSWORD}
      POSTGRES_DB: practice_db
    ports:
      - "5433:5432"
    volumes:
      - practice_postgres_data:/var/lib/postgresql/data

  #db seccion documentos
  document-db:
    image: postgres:15
    container_name: practicahub-document-db
    environment:
      POSTGRES_USER: ${DOCUMENT_DB_USER}
      POSTGRES_PASSWORD: ${DOCUMENT_DB_PASSWORD}
      POSTGRES_DB: document_db
    ports:
      - "5434:5432"
    volumes:
      - document_postgres_data:/var/lib/postgresql/data

  #db notificaciones
  notification-db:
    image: postgres:15-alpine
    container_name: practicahub-notification-db
    environment:
      POSTGRES_USER: ${NOTIFICATION_DB_USER}
      POSTGRES_PASSWORD: ${NOTIFICATION_DB_PASSWORD}
      POSTGRES_DB: notification_db
    ports:
      - "5435:5432"
    volumes:
      - notification_postgres_data:/var/lib/postgresql/data

  # MICROSERVICIOS
  # microservicio de autenticacion
  auth-service:
    build: ./auth-service
    container_name: practicahub-auth
    ports:
      - "8081:8081"
    depends_on:
      - auth-db
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://auth-db:5432/auth_db
      SPRING_DATASOURCE_USERNAME: ${AUTH_DB_USER}
      SPRING_DATASOURCE_PASSWORD: ${AUTH_DB_PASSWORD}
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      JWT_SECRET: ${JWT_SECRET}

  # microservico principal practica
  practice-service:
    build:
      context: ./practice-service
      dockerfile: Dockerfile
    container_name: practicahub-practice
    ports:
      - "8082:8082"
    depends_on:
      - practice-db
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://practice-db:5432/practice_db
      SPRING_DATASOURCE_USERNAME: ${PRACTICE_DB_USER}
      SPRING_DATASOURCE_PASSWORD: ${PRACTICE_DB_PASSWORD}

  #apigateway
  api-gateway:
    build:
      context: ./api-gateway
      dockerfile: Dockerfile
    container_name: practicahub-gateway
    ports:
      - "8080:8080"
    depends_on:
      - auth-service
      - practice-service
    environment:
      - JWT_SECRET=${JWT_SECRET}

  #microservicio de documentos
  document-service:
    build:
      context: ./document-service
    container_name: practicahub-document
    ports:
      - "8083:8083"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://document-db:5432/document_db
      - SPRING_DATASOURCE_USERNAME=${DOCUMENT_DB_USER}
      - SPRING_DATASOURCE_PASSWORD=${DOCUMENT_DB_PASSWORD}
      - SPRING_JPA_HIBERNATE_DDL_AUTO=update
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_KEY=${SUPABASE_KEY}
      - SUPABASE_BUCKET=${SUPABASE_BUCKET}
    volumes:
      - ./uploads:/app/uploads
    depends_on:
      - document-db

  #microservicio notificaciones
  notification-service:
    build:
      context: ./notification-service
      dockerfile: Dockerfile
    container_name: practicahub-notification
    ports:
      - "8084:8084"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://notification-db:5432/notification_db
      - SPRING_DATASOURCE_USERNAME=${NOTIFICATION_DB_USER}
      - SPRING_DATASOURCE_PASSWORD=${NOTIFICATION_DB_PASSWORD}
      - SPRING_JPA_HIBERNATE_DDL_AUTO=update
      - SERVER_PORT=8084
    depends_on:
      - notification-db


# REDES Y VOLÚMENES
networks:
  practicahub-network:
    driver: bridge

volumes:
  auth_postgres_data:
  practice_postgres_data:
  document_postgres_data:
  notification_postgres_data: