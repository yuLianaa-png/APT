version: '3.8'
services:
  db:
    image: postgres:15
    container_name: praticahub_db
    environment:
      POSTGRES_USER: ph_user
      POSTGRES_PASSWORD: rootpassword
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init-dbs.sql:/docker-entrypoint-initdb.d/init-dbs.sql

  volumes:
    pgdata:
  